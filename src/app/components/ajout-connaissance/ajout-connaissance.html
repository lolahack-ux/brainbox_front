<section class="page-retro">
  <div class="fenetre-retro">
    <header class="barre-retro">
      <span>nouvelle_connaissance.exe</span>

      <div class="commandes-fenetre">
        <span>_</span>
        <span>□</span>
        <span>×</span>
      </div>
    </header>

    <div class="contenu-retro">
      <h2 class="titre-retro">
        Ajouter une connaissance
      </h2>


  <form  class="formulaire-retro"
  (ngSubmit)="ajouterConnaissance()">
    <div class="champ">
      <label for="titre">Titre</label>
      
      <input
            id="titre"
            name="titre"
            type="text"
            [(ngModel)]="titre"
            placeholder="Exemple : Lancer Docker Compose" 
      />
    </div>

    <div class="champ">
      <label for="type">Type</label>

      <input
        id="type"
        name="type"
        type="text"
        [(ngModel)]="type"
        placeholder="Exemple : commande"
        />
    </div>

    <div class="champ">
      <label for="technologies">Technologies</label>

     <input
        id="technologies"
        name="technologies"
        type="text"
        [(ngModel)]="technologies"
        placeholder="Exemple : Docker, Node.js"
    />
    </div>

    <div class="champ">
      <label for="description">Description</label>

        <textarea
        id="description"
        name="description"
        rows="4"
        [(ngModel)]="description"
        placeholder="Explique à quoi sert cette connaissance"
        ></textarea>
    </div>

    <div class="champ">
      <label for="code">Code ou commande</label>

      <textarea
        id="code"
        name="code"
        rows="8"
        [(ngModel)]="code"
        placeholder="Exemple : docker compose up"
        ></textarea>
    </div>

    <div class="champ">
      <label for="projet">Projet</label>

     <input
        id="projet"
        name="projet"
        type="text"
        [(ngModel)]="projet"
        placeholder="Exemple : BrainBox"
        />
    </div>

    <div class="champ">
      <label for="fichier">Fichier d’origine</label>

      <input
        id="fichier"
        name="fichier"
        type="text"
        [(ngModel)]="fichier"
        placeholder="Exemple : compose.yaml"
        />
    </div>

    <div class="champ">
      <label for="tags">Tags</label>

      <input
        id="tags"
        name="tags"
        type="text"
        [(ngModel)]="tags"
        placeholder="Exemple : docker, compose, conteneur"
        />
    </div>

    <button
          class="bouton-retro bouton-rose"
          type="submit"
        >
          💾 Enregistrer
        </button>
    @if (messageSucces) {
    <p class="message-succes">
    {{ messageSucces }}
    </p>
  }
    @if (messageErreur) {
    <p class="message-erreur">
    {{ messageErreur }}
    </p>
    }
  </form>
   </div>
  </div>
</section>
