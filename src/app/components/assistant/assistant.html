<section class="page-retro">
  <div class="fenetre-retro">
    <header class="barre-retro">
      <span>assistant_brainbox.exe</span>

      <div class="commandes-fenetre">
        <span>_</span>
        <span>□</span>
        <span>×</span>
      </div>
    </header>

    <div class="contenu-retro assistant-contenu">
      <div class="assistant-mascotte">
        <img
          src="/images/mascotte-brainbox.jpg"
          alt="Mascotte de BrainBox"
        />

        <div class="bulle-retro">
          Pose-moi une question sur tes
          connaissances techniques !
        </div>
      </div>

      <form
        class="formulaire-retro"
        (ngSubmit)="poserQuestion()"
      >
        <label for="question">
          Votre question
        </label>

        <textarea
          id="question"
          name="question"
          rows="5"
          [(ngModel)]="question"
          placeholder="Exemple : Comment lancer Docker Compose ?"
        ></textarea>

        <button
          class="bouton-retro bouton-rose"
          type="submit"
        >
          💬 Poser la question
        </button>
      </form>

      @if (reponse()) {
        <section class="reponse-retro">
          <h3>Réponse de BrainBox</h3>
          <p>{{ reponse() }}</p>
        </section>
      }
    </div>
  </div>
</section>
