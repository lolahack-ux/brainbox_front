<section class="page-retro">
  <div class="fenetre-retro">
    <header class="barre-retro">
      <span>connaissances.exe</span>

      <div class="commandes-fenetre">
        <span>_</span>
        <span>□</span>
        <span>×</span>
      </div>
    </header>

    <div class="contenu-retro">
      <h2 class="titre-retro">
        Mes connaissances
      </h2>

      <div class="grille-connaissances">
        @for (
          connaissance of connaissances();
          track connaissance._id
        ) {
          <article class="carte-connaissance">
            <h3>{{ connaissance.titre }}</h3>

            <p>{{ connaissance.description }}</p>

            <a
              class="bouton-retro bouton-rose"
              [routerLink]="[
                '/modifier',
                connaissance._id
              ]"
            >
              ✏️ Modifier
            </a>
          </article>
        }
      </div>
    </div>
  </div>
</section>
